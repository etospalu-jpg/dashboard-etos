<script>(function(){'use strict';
const V='36.2',DATA_TIMEOUT=12000,BOOT_TIMEOUT=16000;

const status=document.getElementById('boot-status'),bootEl=document.getElementById('boot'),errorBox=document.getElementById('boot-error'),retry=document.getElementById('boot-retry'),sleep=ms=>new Promise(r=>setTimeout(r,ms)),nativeFetch=window.fetch.bind(window);const setStatus=t=>{if(status)status.textContent=t};retry.onclick=()=>location.reload();
window.fetch=function(input,init){init=init||{};if(init.signal)return nativeFetch(input,init);const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),DATA_TIMEOUT);return nativeFetch(input,Object.assign({},init,{signal:controller.signal})).catch(err=>{if(controller.signal.aborted){const e=new Error('Koneksi data melewati batas waktu. Silakan coba lagi.');e.name='ETOSTimeoutError';throw e}throw err}).finally(()=>clearTimeout(timer))};
function load(src,optional=false,timeout=7000){return new Promise((resolve,reject)=>{const s=document.createElement('script');let done=false;const finish=(ok,err)=>{if(done)return;done=true;clearTimeout(timer);if(ok||optional)resolve(ok);else reject(err||new Error(src+' gagal dimuat'))},timer=setTimeout(()=>{try{s.remove()}catch(_){}finish(false,new Error(src+' timeout'))},timeout);s.src=src;s.async=false;s.onload=()=>finish(true);s.onerror=()=>finish(false,new Error(src+' gagal dimuat'));document.head.appendChild(s)})}
let chartPromise=null;window.etosLoadChart=function(){if(window.Chart)return Promise.resolve(window.Chart);if(chartPromise)return chartPromise;chartPromise=load('https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js',true,7000).then(()=>window.Chart||null).catch(()=>null);return chartPromise};
async function libs(){setStatus('Menyiapkan tampilan…');await Promise.all([load('https://cdn.tailwindcss.com',true,5500),window.lucide?Promise.resolve(true):load('https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js',true,5500),window.supabase?Promise.resolve(true):load('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js',true,5500)]);try{if(window.tailwind)window.tailwind.config={theme:{extend:{colors:{etos:{50:'#e8f1ed',600:'#0f6248',950:'#0b1b15'}}}}}}catch(_){}if(!window.lucide)window.lucide={createIcons(){}}}

async function waitVisualReady(){try{if(document.fonts?.ready)await Promise.race([document.fonts.ready,sleep(550)])}catch(_){}await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)))}
function reveal(){const app=document.getElementById('main-app');if(app){app.style.visibility='visible';app.style.opacity='1';app.style.pointerEvents='auto';app.removeAttribute('aria-hidden')}document.body.classList.remove('etos-booting');if(bootEl){bootEl.classList.add('boot-exit');setTimeout(()=>bootEl.remove(),190)}}
function fail(e){console.error('[ETOS v36.2 boot]',e);setStatus('Dashboard belum dapat dibuka.');if(errorBox){errorBox.style.display='block';errorBox.textContent=e?.message||String(e)}if(retry)retry.style.display='block'}
async function reflection(){const m=location.pathname.match(/^\/r\/([^/?#]+)/i);if(!m)return false;await libs();await load('/supabase-adapter.js?v='+V);await load('/app-supabase-authority.js?v='+V);await load('/app-reflection.js?v='+V);await waitVisualReady();if(typeof window.bootReflection!=='function')throw new Error('Form refleksi tidak tersedia.');await Promise.race([window.bootReflection(decodeURIComponent(m[1])),sleep(BOOT_TIMEOUT).then(()=>{throw new Error('Form refleksi melewati batas waktu.')})]);return true}
async function loadGroup(list,label,optional=false){if(!list.length)return;setStatus(label);const jobs=list.map(f=>load('/'+f+'.js?v='+V,optional,6500).catch(e=>{if(optional){console.warn('[ETOS optional]',f,e?.message||e);return false}throw e}));await Promise.all(jobs)}
