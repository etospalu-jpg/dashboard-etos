<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071b13"><meta name="etos-build" content="20260907-0745-stable-v11"><title>ETOS ID Palu — Awardee Intelligence</title><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=11"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/app.css?v=11"><link rel="stylesheet" href="/app-layout.css?v=11"><style>:root{--sidebar-live:286px}html,body{margin:0!important;width:100%!important;min-height:100%!important;overflow-x:hidden!important;background:#f5f7f6!important;font-family:Inter,system-ui,sans-serif}.app-shell{width:100vw!important;min-height:100vh!important;margin:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important;background:#f7f9f8!important}.sidebar{width:var(--sidebar-live)!important;left:0!important;top:0!important;bottom:0!important;height:100vh!important;border-radius:0!important;border:0!important;box-shadow:12px 0 36px rgba(5,28,18,.04)!important}.main{margin-left:var(--sidebar-live)!important;width:calc(100vw - var(--sidebar-live))!important;min-height:100vh!important}.content-pad{width:100%!important;max-width:none!important;margin:0!important;padding:30px 34px 48px!important}.topbar{width:100%!important;height:76px!important;padding-left:34px!important;padding-right:34px!important;background:rgba(249,251,250,.96)!important}#boot{position:fixed;inset:0;z-index:99999;background:#f5f7f6;display:flex;align-items:center;justify-content:center;padding:24px}#boot-card{width:min(420px,100%);background:#071b13;color:#fff;border-radius:24px;padding:30px;box-shadow:0 24px 74px rgba(6,27,18,.15)}#boot-logo{width:176px;height:auto;background:transparent;padding:0;display:flex;align-items:center;justify-content:flex-start}#boot-logo img{width:176px;height:auto;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(0,0,0,.10))}#boot-line{height:2px;background:rgba(255,255,255,.08);margin-top:22px;overflow:hidden;border-radius:99px}#boot-line:after{content:"";display:block;width:36%;height:100%;background:#5cc72a;animation:etload 1s infinite}@keyframes etload{from{transform:translateX(-120%)}to{transform:translateX(390%)}}#runtime-banner{display:none;position:fixed;left:310px;right:24px;bottom:18px;z-index:9999;background:#fff7e8;border:1px solid #ead9b9;color:#725c35;border-radius:13px;padding:10px 13px;font:700 11px/1.4 Inter,sans-serif;box-shadow:0 12px 36px rgba(36,27,12,.08)}.brand-production{padding:22px 22px 17px!important;border-bottom:1px solid rgba(255,255,255,.06)!important;background:transparent!important}.brand-production-card{height:auto!important;width:100%;background:transparent!important;border:0!important;border-radius:0!important;display:flex;align-items:center;justify-content:flex-start;padding:0!important;box-shadow:none!important}.brand-production-card img{display:block;width:172px;max-width:82%;height:auto;object-fit:contain;filter:drop-shadow(0 7px 15px rgba(0,0,0,.10))}.etos-location{display:flex;align-items:center;gap:9px;margin-top:5px;color:#fff;font:800 13px/1 Manrope,Inter,sans-serif;letter-spacing:.20em;text-transform:uppercase}.etos-location:before{content:"";width:21px;height:2px;border-radius:99px;background:#5cc72a;box-shadow:0 0 0 3px rgba(92,199,42,.08)}.etos-brand-sub{margin-top:7px;color:rgba(255,255,255,.36);font-size:8px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.secure-lock{display:none!important}@media(max-width:960px){:root{--sidebar-live:0px}.sidebar{width:min(308px,86vw)!important;transform:translateX(-100%)}.sidebar.open{transform:none}.main{margin-left:0!important;width:100vw!important}.content-pad{padding:20px 18px 34px!important}.topbar{padding-left:18px!important;padding-right:18px!important}#runtime-banner{left:14px;right:14px}}</style></head><body><div id="boot"><div id="boot-card"><div id="boot-logo"><img src="/brand-etos.svg?v=11" alt="ETOS ID"></div><div style="display:flex;align-items:center;gap:9px;margin-top:8px;color:#fff;font:800 12px/1 Manrope,Inter,sans-serif;letter-spacing:.20em"><span style="width:20px;height:2px;border-radius:99px;background:#5cc72a"></span>PALU</div><div style="font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.38);margin-top:8px">Awardee Development Intelligence</div><div id="boot-line"></div><div id="boot-status" style="font-size:10px;color:rgba(255,255,255,.42);margin-top:11px">Menyiapkan ETOS production…</div></div></div><div id="runtime-banner"></div><script>(function(){const status=document.getElementById('boot-status'),banner=document.getElementById('runtime-banner');function err(m){console.error('[ETOS stable v11]',m);if(banner){banner.textContent='ETOS: '+m;banner.style.display='block'}}function load(src,optional){return new Promise(resolve=>{const s=document.createElement('script');s.src=src;s.async=false;let done=false;const t=setTimeout(()=>finish(false),12000);function finish(ok){if(done)return;done=true;clearTimeout(t);if(!ok&&!optional)err(src+' gagal dimuat');resolve(ok)}s.onload=()=>finish(true);s.onerror=()=>finish(false);document.head.appendChild(s)})}async function libs(){await load('https://cdn.tailwindcss.com',true);if(!window.lucide)await load('https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js',true);if(!window.lucide)window.lucide={createIcons:function(){}};if(!window.supabase)await load('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js',true);if(!window.Chart)await load('https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js',true);if(!window.Chart)window.Chart=function(){return{destroy:function(){}}}}function brand(){const side=document.getElementById('sidebar');if(side&&side.firstElementChild){side.firstElementChild.className='brand-production';side.firstElementChild.innerHTML='<div style="position:relative"><div class="brand-production-card"><img src="/brand-etos.svg?v=11" alt="ETOS ID"></div><div class="etos-location"><span>PALU</span></div><div class="etos-brand-sub">Awardee Development Intelligence</div><button class="mobile-only absolute right-0 top-0 w-9 h-9 rounded-xl bg-white/5 text-white items-center justify-center" onclick="toggleSidebar(false)"><i data-lucide="x" class="w-4 h-4"></i></button></div>'}if(window.lucide)lucide.createIcons()}async function reflection(){const m=location.pathname.match(/^\/r\/([^/?#]+)/i);if(!m)return false;status.textContent='Menyiapkan refleksi kajian…';await libs();if(!await load('/supabase-adapter.js?v=11'))throw new Error('adapter gagal');if(!await load('/app-reflection.js?v=11'))throw new Error('refleksi gagal');if(typeof window.bootReflection!=='function')throw new Error('bootReflection tidak ditemukan');document.getElementById('boot').remove();await window.bootReflection(decodeURIComponent(m[1]));return true}async function dashboard(){status.textContent='Memuat dashboard terverifikasi…';const r=await fetch('/shell.html?v=11',{cache:'no-store'});if(!r.ok)throw new Error('shell HTTP '+r.status);const html=await r.text();const parsed=new DOMParser().parseFromString(html,'text/html');parsed.body.querySelectorAll('script').forEach(x=>x.remove());document.body.innerHTML=parsed.body.innerHTML+'<div id="runtime-banner" style="display:none;position:fixed;left:310px;right:24px;bottom:18px;z-index:9999;background:#fff7e8;border:1px solid #ead9b9;color:#725c35;border-radius:13px;padding:10px 13px;font:700 11px/1.4 Inter,sans-serif"></div>';brand();await libs();for(const f of ['/supabase-adapter.js?v=11','/data-authority-2023.js?v=11','/app-auth-diagnostic.js?v=11','/app-core.js?v=11','/app-public.js?v=11','/app-secure.js?v=11','/app-admin.js?v=11','/app-360.js?v=11','/app-system.js?v=11','/app-polish.js?v=11','/app-audit-ui.js?v=11','/app-media-sync.js?v=11','/app-access.js?v=11']){if(!await load(f))throw new Error(f+' gagal dimuat')}brand();if(typeof window.boot==='function')await window.boot();else throw new Error('boot tidak ditemukan')}async function run(){try{if(await reflection())return;await dashboard()}catch(e){err(e&&e.message?e.message:String(e));const b=document.getElementById('boot');if(b)b.style.display='none'}}run()})();</script></body></html>
