<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071b13"><meta name="etos-build" content="20260907-pin-cookie-v13"><title>ETOS ID Palu — Awardee Intelligence</title><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=13"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/app.css?v=13"><link rel="stylesheet" href="/app-layout.css?v=13"><style>:root{--sidebar-live:286px}html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden;background:#f5f7f6;font-family:Inter,system-ui,sans-serif}.app-shell{width:100vw!important;min-height:100vh!important;margin:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:#f7f9f8!important}.sidebar{width:var(--sidebar-live)!important;left:0!important;top:0!important;bottom:0!important;height:100vh!important;border-radius:0!important}.main{margin-left:var(--sidebar-live)!important;width:calc(100vw - var(--sidebar-live))!important;min-height:100vh!important}.content-pad{width:100%!important;max-width:none!important;margin:0!important;padding:30px 34px 48px!important}.topbar{width:100%!important;height:76px!important;padding-left:34px!important;padding-right:34px!important}.brand-production{padding:22px 22px 17px!important;border-bottom:1px solid rgba(255,255,255,.06)!important}.brand-production-card img{display:block;width:172px;max-width:82%;height:auto}.etos-location{display:flex;align-items:center;gap:9px;margin-top:5px;color:#fff;font:800 13px/1 Manrope,Inter,sans-serif;letter-spacing:.20em}.etos-location:before{content:"";width:21px;height:2px;border-radius:99px;background:#5cc72a}.etos-brand-sub{margin-top:7px;color:rgba(255,255,255,.36);font-size:8px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.secure-lock{display:none!important}#boot{position:fixed;inset:0;z-index:99999;background:#f5f7f6;display:flex;align-items:center;justify-content:center;padding:24px}#boot-card{width:min(420px,100%);background:#071b13;color:#fff;border-radius:24px;padding:30px;box-shadow:0 24px 74px rgba(6,27,18,.15)}#boot-card img{width:176px;height:auto}#boot-line{height:2px;background:rgba(255,255,255,.08);margin-top:22px;overflow:hidden;border-radius:99px}#boot-line:after{content:"";display:block;width:36%;height:100%;background:#5cc72a;animation:etload 1s infinite}@keyframes etload{from{transform:translateX(-120%)}to{transform:translateX(390%)}}@media(max-width:960px){:root{--sidebar-live:0px}.sidebar{width:min(308px,86vw)!important;transform:translateX(-100%)}.sidebar.open{transform:none}.main{margin-left:0!important;width:100vw!important}.content-pad{padding:20px 18px 34px!important}.topbar{padding-left:18px!important;padding-right:18px!important}}</style></head><body><div id="boot"><div id="boot-card"><img src="/brand-etos.svg?v=13" alt="ETOS ID"><div style="display:flex;align-items:center;gap:9px;margin-top:8px;font:800 12px/1 Manrope;letter-spacing:.20em"><span style="width:20px;height:2px;background:#5cc72a"></span>PALU</div><div style="font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.38);margin-top:8px">Awardee Development Intelligence</div><div id="boot-line"></div><div id="boot-status" style="font-size:10px;color:rgba(255,255,255,.42);margin-top:11px">Menyiapkan ETOS Palu…</div></div></div><script>(function(){const V='13',status=document.getElementById('boot-status');function load(src,optional){return new Promise(resolve=>{const s=document.createElement('script');s.src=src;s.async=false;s.onload=()=>resolve(true);s.onerror=()=>resolve(!!optional);document.head.appendChild(s)})}async function libs(){await load('https://cdn.tailwindcss.com',true);if(!window.lucide)await load('https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js',true);if(!window.lucide)window.lucide={createIcons(){}};if(!window.supabase)await load('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js',true);if(!window.Chart)await load('https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js',true);if(!window.Chart)window.Chart=function(){return{destroy(){}}}}function brand(){const side=document.getElementById('sidebar');if(side&&side.firstElementChild){side.firstElementChild.className='brand-production';side.firstElementChild.innerHTML='<div style="position:relative"><div class="brand-production-card"><img src="/brand-etos.svg?v='+V+'" alt="ETOS ID"></div><div class="etos-location"><span>PALU</span></div><div class="etos-brand-sub">Awardee Development Intelligence</div><button class="mobile-only absolute right-0 top-0 w-9 h-9 rounded-xl bg-white/5 text-white items-center justify-center" onclick="toggleSidebar(false)"><i data-lucide="x" class="w-4 h-4"></i></button></div>'}if(window.lucide)lucide.createIcons()}async function reflection(){const m=location.pathname.match(/^\/r\/([^/?#]+)/i);if(!m)return false;await libs();await load('/supabase-adapter.js?v='+V);await load('/app-reflection.js?v='+V);document.getElementById('boot')?.remove();if(typeof window.bootReflection==='function')await window.bootReflection(decodeURIComponent(m[1]));return true}async function dashboard(){status.textContent='Memuat dashboard…';const r=await fetch('/shell.html?v='+V,{cache:'no-store'});if(!r.ok)throw new Error('shell HTTP '+r.status);const parsed=new DOMParser().parseFromString(await r.text(),'text/html');parsed.body.querySelectorAll('script').forEach(x=>x.remove());document.body.innerHTML=parsed.body.innerHTML;brand();await libs();const files=['supabase-adapter','data-authority-2023','app-core','app-public','app-secure','app-admin','app-360','app-system','app-polish','app-audit-ui','app-media-sync','app-access'];for(const f of files){if(!await load('/'+f+'.js?v='+V))throw new Error(f+' gagal dimuat')}brand();if(typeof window.boot==='function')await window.boot();else throw new Error('boot tidak ditemukan')}async function run(){try{if(await reflection())return;await dashboard()}catch(e){console.error('[ETOS v13]',e);document.getElementById('boot')?.remove();alert('ETOS gagal dimuat: '+(e?.message||e))}}run()})();</script></body></html>
