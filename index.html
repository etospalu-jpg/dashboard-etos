<script>(function(){'use strict';

function load(src,optional=false,timeout=7000){if(loaded.has(src))return loaded.get(src);const job=new Promise((resolve,reject)=>{const s=document.createElement('script');let done=false;const finish=(ok,err)=>{if(done)return;done=true;clearTimeout(timer);if(ok||optional)resolve(ok);else reject(err||new Error(src+' gagal dimuat'))};const timer=setTimeout(()=>{try{s.remove()}catch(_){}finish(false,new Error(src+' timeout'))},timeout);s.src=src;s.async=false;s.onload=()=>finish(true);s.onerror=()=>finish(false,new Error(src+' gagal dimuat'));document.head.appendChild(s)});loaded.set(src,job);return job}
