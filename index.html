<script>(function(){'use strict';
const V='36.9',DATA_TIMEOUT=12000;window.ETOS_VERSION=V;window.ETOS_BOOT_RESILIENCE='v36.9-backoffice-entry';

function load(src,optional=false,timeout=7000){if(loaded.has(src))return loaded.get(src);const job=new Promise((resolve,reject)=>{const s=document.createElement('script');let done=false;const finish=(ok,err)=>{if(done)return;done=true;clearTimeout(timer);if(ok||optional)resolve(ok);else reject(err||new Error(src+' gagal dimuat'))};const timer=setTimeout(()=>{try{s.remove()}catch(_){}finish(false,new Error(src+' timeout'))},timeout);s.src=src;s.async=false;s.onload=()=>finish(true);s.onerror=()=>finish(false,new Error(src+' gagal dimuat'));document.head.appendChild(s)});loaded.set(src,job);return job}
window.etosLoadModule=async function(name){const ok=await load('/'+name+'.js?v='+V,false,7000);try{window.dispatchEvent(new CustomEvent('etos:enhancements-ready',{detail:{module:name}}));window.lucide?.createIcons?.()}catch(_){}return ok};
let chartPromise=null;window.etosLoadChart=function(){if(window.Chart)return Promise.resolve(window.Chart);if(chartPromise)return chartPromise;chartPromise=load('https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js',true,7000).then(()=>window.Chart||null).catch(()=>null);return chartPromise};
async function libs(){const tailwind=load('https://cdn.tailwindcss.com',false,7000),lucide=window.lucide?Promise.resolve(true):load('https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js',true,6000),supa=window.supabase?Promise.resolve(true):load('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js',true,6000);await Promise.all([tailwind,lucide,supa]);try{if(window.tailwind)window.tailwind.config={theme:{extend:{colors:{etos:{50:'#e8f1ed',600:'#0f6248',950:'#0b1b15'}}}}}}catch(_){}if(!window.lucide)window.lucide={createIcons(){}}}
