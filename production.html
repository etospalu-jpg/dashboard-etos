<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071b13">
  <title>ETOS ID Palu — Awardee Intelligence</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css?v=4">
  <link rel="stylesheet" href="/app-layout.css?v=4">
  <style>
    :root{--sidebar-live:286px}
    html,body{margin:0!important;width:100%!important;min-height:100%!important;overflow-x:hidden!important;background:#f5f7f6!important}
    .app-shell{width:100vw!important;min-height:100vh!important;margin:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important;background:#f7f9f8!important}
    .sidebar{width:var(--sidebar-live)!important;left:0!important;top:0!important;bottom:0!important;height:100vh!important;border-radius:0!important;border:0!important;box-shadow:12px 0 36px rgba(5,28,18,.04)!important}
    .main{margin-left:var(--sidebar-live)!important;width:calc(100vw - var(--sidebar-live))!important;min-height:100vh!important}
    .content-pad{width:100%!important;max-width:none!important;margin:0!important;padding:30px 34px 48px!important}
    .topbar{width:100%!important;height:76px!important;padding-left:34px!important;padding-right:34px!important;background:rgba(249,251,250,.96)!important}
    .hero{border-radius:22px!important}
    .brand-production{padding:19px 20px 17px;border-bottom:1px solid rgba(255,255,255,.06)}
    .brand-production-card{height:63px;width:100%;background:#fff;border-radius:17px;display:flex;align-items:center;justify-content:center;padding:11px 15px;box-shadow:0 13px 32px rgba(0,0,0,.14)}
    .brand-production-card img{display:block;max-width:100%;height:38px;width:auto;object-fit:contain}
    .brand-production-meta{display:flex;align-items:center;justify-content:space-between;margin-top:9px;padding:0 2px;color:rgba(255,255,255,.42);font-size:8.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
    .brand-production-meta strong{color:rgba(255,255,255,.76)}
    #boot-screen{position:fixed;inset:0;z-index:9999;background:#f5f7f6;display:flex;align-items:center;justify-content:center;padding:24px}
    #boot-card{width:min(420px,100%);background:#071b13;color:#fff;border-radius:24px;padding:28px;box-shadow:0 24px 74px rgba(6,27,18,.15)}
    #boot-logo{width:150px;height:58px;border-radius:15px;background:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:center}
    #boot-logo img{width:100%;height:100%;object-fit:contain}
    #boot-line{height:2px;background:rgba(255,255,255,.08);margin-top:22px;overflow:hidden;border-radius:99px}
    #boot-line:after{content:"";display:block;width:36%;height:100%;background:#5cc72a;animation:etload 1s infinite}
    @keyframes etload{from{transform:translateX(-120%)}to{transform:translateX(390%)}}
    #runtime-banner{display:none;position:fixed;left:calc(var(--sidebar-live) + 24px);right:24px;bottom:18px;z-index:999;background:#fff7e8;border:1px solid #ead9b9;color:#725c35;border-radius:13px;padding:10px 13px;font:700 11px/1.4 Inter,sans-serif;box-shadow:0 12px 36px rgba(36,27,12,.08)}
    @media(max-width:960px){
      :root{--sidebar-live:0px}
      .sidebar{width:min(308px,86vw)!important;transform:translateX(-100%)}
      .sidebar.open{transform:none}
      .main{margin-left:0!important;width:100vw!important}
      .content-pad{padding:20px 18px 34px!important}
      .topbar{padding-left:18px!important;padding-right:18px!important}
      #runtime-banner{left:14px;right:14px}
    }
  </style>
</head>
<body>
<div id="boot-screen">
  <div id="boot-card">
    <div id="boot-logo"><img src="/brand-etos.svg?v=4" alt="ETOS ID"></div>
    <div style="font:800 21px/1.2 Manrope,Inter,sans-serif;margin-top:20px">ETOS ID Palu</div>
    <div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.46);margin-top:7px">Awardee Development Intelligence</div>
    <div id="boot-line"></div>
    <div id="boot-status" style="font-size:10px;color:rgba(255,255,255,.42);margin-top:11px">Menyiapkan dashboard production…</div>
  </div>
</div>
<div id="runtime-banner"></div>
<script>
(function(){
  const status=document.getElementById('boot-status');
  const banner=document.getElementById('runtime-banner');
  function showError(message){
    banner.textContent='ETOS: '+message;
    banner.style.display='block';
    console.error('[ETOS production]',message);
  }
  function loadScript(src,optional){
    return new Promise(resolve=>{
      const s=document.createElement('script');s.src=src;s.async=false;
      let done=false;const timer=setTimeout(()=>finish(false),10000);
      function finish(ok){if(done)return;done=true;clearTimeout(timer);if(!ok&&!optional)showError(src+' gagal dimuat');resolve(ok)}
      s.onload=()=>finish(true);s.onerror=()=>finish(false);document.head.appendChild(s);
    });
  }
  function applyBrandNow(){
    const side=document.getElementById('sidebar');
    if(side&&side.firstElementChild){
      side.firstElementChild.className='brand-production';
      side.firstElementChild.innerHTML='<div style="position:relative"><div class="brand-production-card"><img src="/brand-etos.svg?v=4" alt="ETOS ID"></div><div class="brand-production-meta"><strong>Palu</strong><span>Awardee Intelligence</span></div><button class="mobile-only absolute right-2 top-2 w-9 h-9 rounded-xl bg-[#0b1b15]/5 text-[#0b1b15] items-center justify-center" onclick="toggleSidebar(false)"><i data-lucide="x" class="w-4 h-4"></i></button></div>';
    }
    let icon=document.querySelector('link[rel~="icon"]');
    if(icon)icon.href='/favicon.svg?v=4';
  }
  function wireDataSource(){
    window.addEventListener('etos:data-source',e=>{
      const source=e.detail&&e.detail.source;
      const dot=document.querySelector('#sidebar .status-dot');
      const label=dot&&dot.nextElementSibling;
      if(label){
        label.textContent=source==='snapshot'?'Data Synced Cache':'Supabase Connected';
        label.style.color=source==='snapshot'?'#e8c981':'';
      }
    });
  }
  async function libs(){
    await loadScript('https://cdn.tailwindcss.com',true);
    if(!window.lucide)await loadScript('https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js',true);
    if(!window.lucide)window.lucide={createIcons:function(){}};
    if(!window.supabase)await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js',true);
    if(!window.Chart)await loadScript('https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js',true);
    if(!window.Chart)window.Chart=function(){return{destroy:function(){}}};
  }
  async function bootDashboard(){
    try{
      status.textContent='Memuat shell ETOS…';
      const r=await fetch('/index.html?production=4',{cache:'no-store'});
      if(!r.ok)throw new Error('index.html HTTP '+r.status);
      const html=await r.text();
      const parsed=new DOMParser().parseFromString(html,'text/html');
      parsed.body.querySelectorAll('script').forEach(x=>x.remove());
      document.body.innerHTML=parsed.body.innerHTML+'<div id="runtime-banner" style="display:none;position:fixed;left:310px;right:24px;bottom:18px;z-index:999;background:#fff7e8;border:1px solid #ead9b9;color:#725c35;border-radius:13px;padding:10px 13px;font:700 11px/1.4 Inter,sans-serif;box-shadow:0 12px 36px rgba(36,27,12,.08)"></div>';
      applyBrandNow();wireDataSource();
      await libs();
      const files=['/supabase-adapter.js?v=4','/app-core.js?v=4','/app-public.js?v=4','/app-secure.js?v=4','/app-admin.js?v=4','/app-360.js?v=4','/app-system.js?v=4','/app-branding.js?v=4'];
      for(const file of files){if(!await loadScript(file,false))throw new Error(file+' gagal dimuat')}
      applyBrandNow();
      if(typeof lucide!=='undefined')lucide.createIcons();
      if(document.readyState!=='loading'&&typeof window.boot==='function')await window.boot();
      const bootEl=document.getElementById('boot-screen');if(bootEl)bootEl.remove();
    }catch(e){
      showError(e&&e.message?e.message:String(e));
      const b=document.getElementById('boot-screen');if(b)b.style.display='none';
      const app=document.getElementById('main-app');if(app)app.style.display='flex';
    }
  }
  bootDashboard();
})();
</script>
</body>
</html>
