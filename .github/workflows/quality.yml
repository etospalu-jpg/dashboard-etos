name: ETOS Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: etos-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run ETOS quality gate
        run: |
          node scripts/quality-check.js
          node scripts/v36-1-check.js
      - name: Smoke test verified IDP fallback
        run: node scripts/idp-fallback-smoke.js
