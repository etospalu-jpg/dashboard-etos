name: ETOS Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: etos-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Legacy v36 diagnostic (non-blocking for v38)
        continue-on-error: true
        run: |
          node scripts/quality-check.js
          node scripts/v36-1-check.js
      - name: Validate current runtime syntax
        run: |
          node --check idp-live-v32.js
          node --check app-keislaman.js
          node --check app-ski.js
          node --check app-view-health.js
          node --check tahfidz-handler.js
      - name: Smoke test verified IDP fallback
        run: node scripts/idp-fallback-smoke.js
      - name: Verify production bundle and V38 UI contracts
        run: |
          npm install --no-audit --no-fund
          npm run build
