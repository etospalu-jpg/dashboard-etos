name: ETOS Browser Regression
on:
  push:
    branches: [quality/tahfidz-v3810]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save playwright@1.56.1
      - run: npm run build
      - name: Browser route regression
        run: |
          command -v google-chrome || true
          node scripts/tahfidz-browser-smoke.cjs
          node scripts/etos-live-diagnostic.cjs
